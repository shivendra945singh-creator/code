<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get & Post Request </title>
</head>
<body>
    <h3>Get Request Form</h3>
    <form method="get" action="http://localhost:8080/register">  <!-- iss form mein jab data fill karke submit karege toh browser url mein show hoga "http://localhost:8080/register"   // in simple language ye woh link hai jaha hum apna form bejna chate hai -->
         <input placeholder=" enter username" name="user" type="text" />  <!-- when we  enter details in our form like   enter username = shivam , enter password = 1234 then in browser url show http://localhost:8080/register user = shivam & password = 1234 -->
        <input placeholder=" enter password" name="password" type="password" /> <!-- means form mein jo  data  hum fill karte hai woh url mein show hota hai -->
        <button>Submit</button>
    </form>

    <h3>Post Request Form</h3>
    <form method="post" action="http://localhost:8080/register">
         <input placeholder=" enter username" name="user" type="text" />  <!--  when we  enter details in form like  username = shivam , enter password = 1234 then in browser url show only http://localhost:8080/register -->
        <input placeholder=" enter password" name="password" type="password" />  <!-- means form mein jo  data  hum fill karte hai woh url mein show  nhi hota hai -->
        <button>Submit</button>
    </form>
</body>
</html>
