<!--using style tag-->  <!--style tag is not suitable for a multiple file, its changes remain in only one file -->

<style>
    h1 {
        color: blue;
    }
    
</style>
</head>

<h1>This is a heading</h1>
<h1 >This is a reading</h1>
<h1 >This is a writing</h1>

<!--linking html with css file-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>linking html with css file</title>
    <link rel="stylesheet"  href="style.css">
</head>
<body>
   <h2>This is a heading</h2>
   <h2>This is a reading</h2>
   <h2>This is a writing</h2> 
</body>
</html>
